words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false
atom_feed:
  hide                   : false
  path                   :

# ==========================
# SEO Related
# ==========================
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# ==========================
# Social Sharing
# ==========================
